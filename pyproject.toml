[project]
name = "ecommerce-cdc"
version = "0.1.0"
description = "CDC Event Testing Dashboard for ecommerce system"
readme = "README.md"
requires-python = ">=3.9,<3.12"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "streamlit>=1.39.0,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "kafka-python>=2.0.2,<3.0.0",
    "plotly>=5.24.1,<6.0.0",
    "requests>=2.32.3,<3.0.0",
    "pyspark==3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "application/cdc-testing-ui",
    "data-platform/streaming/spark/src",
]
