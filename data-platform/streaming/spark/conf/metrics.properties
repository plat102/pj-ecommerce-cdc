# Spark metrics config for Prometheus scraping.
# Referenced from submit_job.sh via --conf spark.metrics.conf.
#
# Spark 3.x ships a built-in PrometheusServlet that exposes JMX-derived
# metrics on the Spark UI port under /metrics/prometheus. Enabled per-app
# via spark.ui.prometheus.enabled=true in submit_job.sh.

# Emit all instances (driver, executor, master, worker) via the built-in
# Prometheus servlet. Path is /metrics/prometheus on the Spark UI port.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# Keep the default JVM source for GC + memory metrics; useful for spotting
# executor OOM before a Spark job dies without symptoms.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
