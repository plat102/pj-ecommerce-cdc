services:
  zookeeper:
    image: confluentinc/cp-zookeeper:${ZOOKEEPER_IMAGE_TAG:-7.8.2}
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  kafka1:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-7.8.2}
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_IMAGE_TAG:-v2.8.7}
    container_name: redpanda-console
    ports:
      - "8080:8080"
    depends_on:
      - kafka1
      - schema-registry
    environment:
      CONFIG_FILEPATH: /tmp/config/config.yaml
    volumes:
      - ./kafka/console-config.yaml:/tmp/config/config.yaml
    networks:
      - ecommerce-network

  # Apicurio Registry: open-source (Apache 2.0) schema registry.
  # Debezium image bundles the matching Apicurio Avro converter out of the box
  # via ENABLE_APICURIO_CONVERTERS=true (see docker-compose.debezium.yml).
  # Apicurio exposes a Confluent-compatible REST API at /apis/ccompat/v7 if a
  # tool insists on the Confluent shape.
  schema-registry:
    image: apicurio/apicurio-registry-mem:${APICURIO_IMAGE_TAG:-2.5.11.Final}
    container_name: schema-registry
    depends_on:
      - kafka1
    ports:
      - "8081:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_PROFILE: prod
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network
    