services:
  zookeeper:
    image: confluentinc/cp-zookeeper:${ZOOKEEPER_IMAGE_TAG:-7.8.2}
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Confluent's cp-zookeeper 7.x whitelists no 4-letter-words by default;
      # opt in to `ruok` for a lightweight healthcheck.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,stat
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | (exec 3<>/dev/tcp/localhost/2181; cat >&3; cat <&3; exec 3<&-) | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecommerce-network

  kafka1:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-7.8.2}
    container_name: kafka1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_IMAGE_TAG:-v2.8.7}
    container_name: redpanda-console
    restart: on-failure:3
    ports:
      - "8080:8080"
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      CONFIG_FILEPATH: /tmp/config/config.yaml
    volumes:
      - ./kafka/console-config.yaml:/tmp/config/config.yaml
    networks:
      - ecommerce-network

  # Apicurio Registry: open-source (Apache 2.0) schema registry.
  # Debezium image bundles the matching Apicurio Avro converter out of the box
  # via ENABLE_APICURIO_CONVERTERS=true (see docker-compose.debezium.yml).
  # Apicurio exposes a Confluent-compatible REST API at /apis/ccompat/v7 if a
  # tool insists on the Confluent shape.
  schema-registry:
    image: apicurio/apicurio-registry-mem:${APICURIO_IMAGE_TAG:-2.5.11.Final}
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_PROFILE: prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/apis/registry/v2/system/info >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network
    