services:
  debezium:
    image: debezium/connect:${DEBEZIUM_IMAGE_TAG:-2.7.3.Final}
    container_name: debezium
    depends_on:
      - kafka1
      - schema-registry
    ports:
      - "8083:8083"   # Kafka Connect REST API
      - "5556:5556"   # jmx-exporter javaagent (Phase 2 observability)
    volumes:
      # jmx-exporter javaagent + rule config. Jar is fetched by
      # scripts/setup_observability.sh; gitignored.
      - ./jmx-exporter:/opt/jmx-exporter:ro
    environment:
      # --- Kafka Connect settings ---
      BOOTSTRAP_SERVERS: kafka1:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses

      # --- Converter settings: Avro + Apicurio Registry ---
      # debezium/connect bundles the Apicurio Avro converter when
      # ENABLE_APICURIO_CONVERTERS=true. Apicurio's registry runs on the
      # in-container port 8080 (published host-side as 8081); the /apis/registry/v2
      # path is Apicurio's native REST API.
      ENABLE_APICURIO_CONVERTERS: "true"
      KEY_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      VALUE_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_URL: http://schema-registry:8080/apis/registry/v2
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_URL: http://schema-registry:8080/apis/registry/v2
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER_ARTIFACT: "true"
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER_ARTIFACT: "true"

      # --- Debezium specific settings ---
      ENABLE_DEBEZIUM_SCRIPTING: "true"
      ENABLE_DEBEZIUM_KC_REST_EXTENSION: "true"
      CONNECT_REST_EXTENSION_CLASSES: io.debezium.kcrestextension.DebeziumConnectRestExtension

      # --- Observability (Phase 2): jmx-exporter as javaagent ---
      # Debezium's start script honors KAFKA_OPTS by appending it to the JVM
      # command line. Serves connector + JVM metrics at :5556/metrics.
      KAFKA_OPTS: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.20.0.jar=5556:/opt/jmx-exporter/debezium-jmx.yml
    networks:
      - ecommerce-network

  debezium-ui:
    image: quay.io/debezium/debezium-ui:${DEBEZIUM_UI_IMAGE_TAG:-2.5}
    container_name: debezium-ui
    depends_on:
      - debezium
    ports:
      - "8085:8080"  # UI port
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      - ecommerce-network
