# Grafana Loki Datasource Configuration
# Populated by Alloy from container stdout/stderr; 7d retention.

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      timeout: 60
