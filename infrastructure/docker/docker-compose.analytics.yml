services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-23.8-alpine}
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ecommerce_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_ANALYST_PASSWORD: ${CLICKHOUSE_ANALYST_PASSWORD:-analyst_readonly_change_me}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - ./clickhouse/create_governance_users.sh:/docker-entrypoint-initdb.d/create_governance_users.sh
      # Force IPv4-only listen. Docker Desktop's LinuxKit VM often has IPv6
      # disabled, and 23.8-alpine's default `[::]` bind then fails.
      - ./clickhouse/listen-ipv4.xml:/etc/clickhouse-server/config.d/listen-ipv4.xml:ro
    healthcheck:
      # Force IPv4 (127.0.0.1) — `localhost` resolves to `::1` inside the
      # container, but ClickHouse listens on 0.0.0.0 via listen-ipv4.xml.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - ecommerce-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.3.12}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: >
        grafana-clickhouse-datasource ${GRAFANA_CLICKHOUSE_PLUGIN_VERSION:-4.8.2}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: vertamedia-clickhouse-datasource
      CLICKHOUSE_ANALYST_PASSWORD: ${CLICKHOUSE_ANALYST_PASSWORD:-analyst_readonly_change_me}
      # Env vars for Grafana Unified Alerting contact points (observability Phase 3).
      OBS_ALERT_WEBHOOK_URL: ${OBS_ALERT_WEBHOOK_URL:-}
      OBS_SLACK_WEBHOOK_URL: ${OBS_SLACK_WEBHOOK_URL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  grafana_data:

networks:
  ecommerce-network:
    external: true
    name: ecommerce-network
